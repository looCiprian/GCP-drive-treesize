{{define "content"}}
<style>
    .scan { max-width: 520px; margin: 64px auto; text-align: center; padding: 40px 32px; }
    .scan h1 { margin: 20px 0 8px; }
    .spinner {
        width: 44px; height: 44px; margin: 0 auto;
        border: 4px solid var(--surface-2); border-top-color: var(--accent);
        border-radius: 50%; animation: spin .9s linear infinite;
    }
    .count { font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; margin: 20px 0 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
</style>

<section class="card scan">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Scanning your Drive…</h1>
    <p class="muted">This can take a few minutes if you have many files. You can keep this page open, it will
        update on its own.</p>
    <p class="count" aria-live="polite"><span id="fetched">{{.Fetched}}</span></p>
    <small>items found</small>
</section>

<script>
    (function poll() {
        fetch("/api/status").then(function (r) { return r.json(); }).then(function (s) {
            if (s.phase !== "scanning") { location.href = "/"; return; }
            document.getElementById("fetched").textContent = s.fetched.toLocaleString();
            setTimeout(poll, 1000);
        }).catch(function () { setTimeout(poll, 3000); });
    })();
</script>
{{end}}
